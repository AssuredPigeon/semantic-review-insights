name: NLP Pipeline CI

# Runs on every push to main and on all pull requests.
# Validates the NLP ingestion pipeline and runs the backend test suite.
#
# MLOps context:
#   Automating build + test on every push catches regressions in the NLP
#   pipeline (validation logic, vectorization, DB schema) before they reach
#   production. The sentence-transformer model is mocked in tests so CI
#   runs fast without downloading large model files.
#
# Architecture note:
#   We use an explicit `docker run` for postgres+pgvector instead of service
#   containers, which avoids GitHub Actions service container setup issues
#   and gives us explicit health-check control.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-nlp-pipeline:
    name: Test NLP Pipeline & API
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # These env vars mirror what the backend app reads at runtime.
    # Safe dummy values — no real secrets needed for running tests.
    env:
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-test-password
      SECRET_KEY: ci-test-secret-key-not-for-production
      FIRST_SUPERUSER: admin@example.com
      FIRST_SUPERUSER_PASSWORD: ci-test-password
      DOMAIN: localhost
      ENVIRONMENT: local
      FRONTEND_HOST: http://localhost:5173
      PROJECT_NAME: "Semantic Review Insights"
      BACKEND_CORS_ORIGINS: "http://localhost"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.18"

      # Start PostgreSQL with pgvector pre-installed via explicit docker run.
      # This avoids GitHub Actions service container setup issues.
      - name: Start PostgreSQL + pgvector
        run: |
          docker run -d \
            --name postgres-ci \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=ci-test-password \
            -e POSTGRES_DB=app \
            -p 5432:5432 \
            pgvector/pgvector:pg16

      - name: Wait for PostgreSQL to be ready
        run: |
          echo "Waiting for PostgreSQL..."
          for i in $(seq 1 30); do
            docker exec postgres-ci pg_isready -U postgres && echo "Ready!" && break
            echo "Attempt $i: not ready yet, sleeping 2s..."
            sleep 2
          done

      - name: Enable pgvector extension
        run: |
          docker exec postgres-ci psql -U postgres -d app \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Install backend dependencies
        run: uv sync --all-groups
        working-directory: backend

      - name: Apply Alembic migrations
        run: uv run bash scripts/prestart.sh
        working-directory: backend

      - name: Run NLP pipeline & reviews tests
        run: uv run pytest tests/api/routes/test_reviews.py -v --tb=short
        working-directory: backend

      - name: Stop and remove PostgreSQL container
        if: always()
        run: docker stop postgres-ci && docker rm postgres-ci
