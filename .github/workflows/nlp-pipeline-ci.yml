name: NLP Pipeline CI

# Runs on every push to main and on all pull requests.
# Validates the NLP ingestion pipeline and runs the backend test suite.
#
# MLOps context:
#   Automating build + test on every push catches regressions in the NLP
#   pipeline (validation logic, vectorization, DB schema) before they reach
#   production. The sentence-transformer model is mocked in tests so CI
#   runs fast without downloading large model files.
#
# Architecture note:
#   Instead of running `docker compose build` (which builds the frontend with
#   bun + Python 3.14 and requires Traefik networking), we use GitHub Actions
#   native service containers for PostgreSQL + pgvector. This is the standard
#   approach for backend CI: lightweight, fast, and no infra overhead.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-nlp-pipeline:
    name: Test NLP Pipeline & API
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Native service container — spins up PostgreSQL with pgvector.
    # No docker compose, no Traefik, no .env required.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    # These env vars mirror what the backend app reads from .env.
    # Safe dummy values — no real secrets needed for running tests.
    env:
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-test-password
      SECRET_KEY: ci-test-secret-key-not-for-production
      FIRST_SUPERUSER: admin@example.com
      FIRST_SUPERUSER_PASSWORD: ci-test-password
      DOMAIN: localhost
      ENVIRONMENT: local
      FRONTEND_HOST: http://localhost:5173

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          version: "0.11.18"

      - name: Enable pgvector extension
        run: |
          PGPASSWORD=ci-test-password psql -h localhost -U postgres -d app \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Install backend dependencies
        run: uv sync --all-groups
        working-directory: backend

      - name: Apply Alembic migrations
        run: uv run bash scripts/prestart.sh
        working-directory: backend

      - name: Run NLP pipeline & reviews tests
        run: uv run pytest tests/api/routes/test_reviews.py -v --tb=short
        working-directory: backend
